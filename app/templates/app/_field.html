<div class="field{% if field.errors %} field-invalid{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required" aria-label="required">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="field-help">{{ field.help_text|safe }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
</div>
