<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Diabetic Retinopathy App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --light: #f8fafc;
            --dark: #1e293b;
            --white: #ffffff;
            --border: #e2e8f0;
            --input-bg: #f1f5f9;
            --text-light: #ffffff;
            --text-secondary: #64748b;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        
        .login-container {
            display: flex;
            height: 100vh;
        }
        
        .login-form-section {
            background-color: var(--white);
            color: var(--dark);
            width: 50%;
            padding: 2rem 4rem;
            display: flex;
            flex-direction: column;
        }
        
        .image-section {
            width: 50%;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
        }
        
        .app-logo {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .app-logo img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }
        
        .app-logo h2 {
            font-size: 1.6rem;
            margin: 0;
            font-weight: 600;
            color: var(--dark);
        }
        
        .greeting {
            margin-top: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .greeting h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }
        
        .greeting p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--dark);
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            color: var(--dark);
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .phone-input {
            display: flex;
        }
        
        .country-code {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 0.375rem 0 0 0.375rem;
            padding: 0 0.75rem;
            display: flex;
            align-items: center;
            color: var(--dark);
        }
        
        .phone-input .form-control {
            border-radius: 0 0.375rem 0.375rem 0;
            border-left: none;
        }
        
        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            border: none;
            border-radius: 0.375rem;
            color: white;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }
        
        .submit-btn:hover {
            background-color: #1d4ed8;
        }
        
        .footer {
            margin-top: auto;
            padding-top: 2rem;
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .footer a {
            color: var(--primary);
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }
            
            .login-form-section {
                width: 100%;
                height: 100%;
                padding: 1.5rem;
            }
            
            .image-section {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-form-section">
            
            <div class="greeting">
                <h1>Hi there 👋</h1>
                <p>Get started with your account.</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                
                <button type="submit" class="submit-btn">Get Started</button>
                
                <div class="mt-3 text-center">
                    <p>Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary);">Register</a></p>
                </div>
            </form>
            
            <div class="footer">
                <div>© 2025 DR Vision</div>
                <a href="#">Admin</a>
            </div>
        </div>
        
        <div class="image-section">
            <img src="/static/app/images/onboarding-img.png" alt="Medical Team">
        </div>
    </div>
</body>
</html>
